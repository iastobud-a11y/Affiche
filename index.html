<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17111d">
  <meta name="description" content="Affiche de la soirée Halloween des licenciés de l’AS Verzy.">
  <title>Soirée Halloween — AS Verzy</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #fff3dc;
      --muted: #d3c4d2;
      --orange: #ff7b27;
      --lime: #d5f16a;
      --night: #17111d;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 28px;
      overflow-x: hidden;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 50% 108%, #5b2635 0, transparent 48%),
        radial-gradient(ellipse at 12% 0%, #38213d 0, transparent 42%),
        var(--night);
      font-family: "Trebuchet MS", Arial, sans-serif;
    }

    .poster {
      position: relative;
      isolation: isolate;
      width: min(100%, 720px);
      min-height: 920px;
      padding: clamp(30px, 7vw, 68px);
      overflow: hidden;
      text-align: center;
      border: 1px solid rgb(255 243 220 / 22%);
      border-radius: 28px;
      background:
        linear-gradient(180deg, rgb(29 19 34 / 20%) 0%, rgb(23 17 29 / 18%) 48%, #241622 100%),
        radial-gradient(ellipse at 50% 42%, #593348 0%, #2b1d33 54%, #1a1422 100%);
      box-shadow: 0 30px 90px rgb(0 0 0 / 45%);
    }

    .poster::before, .poster::after {
      position: absolute;
      z-index: -1;
      content: "";
      border: 1px solid rgb(255 123 39 / 30%);
      border-radius: 50%;
      pointer-events: none;
    }
    .poster::before { width: 520px; height: 520px; top: 210px; left: 50%; transform: translateX(-50%); }
    .poster::after { width: 600px; height: 600px; top: 170px; left: 50%; transform: translateX(-50%); border-color: rgb(213 241 106 / 12%); }

    .corner { position: absolute; color: var(--lime); font-size: 30px; opacity: .8; }
    .corner.one { top: 25px; left: 28px; transform: rotate(-15deg); }
    .corner.two { top: 30px; right: 30px; color: var(--orange); transform: rotate(12deg); }

    .club { margin: 0; color: var(--lime); font-size: .82rem; font-weight: 800; letter-spacing: .24em; text-transform: uppercase; }
    .eyebrow { margin: 42px 0 8px; color: var(--orange); font-size: .9rem; font-weight: 800; letter-spacing: .32em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(4.5rem, 17vw, 9.5rem); font-weight: 1000; line-height: .78; letter-spacing: -.09em; text-transform: uppercase; text-shadow: 0 5px 0 #9e421f, 0 12px 35px rgb(0 0 0 / 35%); }
    h1 span { display: block; color: var(--orange); }
    .subtitle { margin: 25px 0 0; color: var(--ink); font-size: clamp(1.05rem, 3vw, 1.4rem); font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }

    .moon-scene { position: relative; height: 250px; margin: 16px auto 10px; }
    .moon { position: absolute; top: 22px; left: 50%; width: 150px; height: 150px; transform: translateX(-50%); border-radius: 50%; background: #f7e7b5; box-shadow: 0 0 45px rgb(255 234 183 / 35%); }
    .moon::after { position: absolute; top: -11px; left: 27px; width: 150px; height: 150px; border-radius: 50%; background: #38233a; content: ""; }
    .bat { position: absolute; z-index: 1; color: var(--night); font-size: 2rem; }
    .bat.a { top: 57px; left: 18%; transform: rotate(-12deg); }
    .bat.b { top: 112px; right: 14%; font-size: 1.4rem; transform: rotate(11deg); }
    .bat.c { top: 25px; right: 29%; color: #271a2c; font-size: 1.1rem; }
    .pumpkins { position: absolute; right: 0; bottom: 0; left: 0; display: flex; align-items: end; justify-content: center; gap: 12px; font-size: clamp(3.2rem, 10vw, 5.2rem); filter: drop-shadow(0 12px 12px rgb(0 0 0 / 35%)); }
    .pumpkins span:nth-child(2) { font-size: 1.25em; }

    .invitation { margin: 7px 0 0; color: var(--lime); font-size: clamp(1.7rem, 5vw, 2.45rem); font-weight: 900; line-height: 1.1; text-transform: uppercase; }
    .for-who { margin: 10px 0 0; color: var(--muted); font-size: 1rem; letter-spacing: .08em; }
    .rule { width: 72px; height: 3px; margin: 27px auto; border: 0; background: var(--orange); }
    .details { display: inline-block; padding: 13px 22px; border: 1px solid rgb(255 243 220 / 35%); border-radius: 999px; color: var(--ink); font-size: .88rem; font-weight: 700; letter-spacing: .06em; }
    .footer { margin: 30px 0 0; color: var(--muted); font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; }

    @media (max-width: 520px) {
      body { padding: 12px; }
      .poster { min-height: 820px; padding: 38px 22px; border-radius: 20px; }
      .eyebrow { margin-top: 40px; }
      .moon-scene { height: 220px; }
      .moon { width: 125px; height: 125px; }
      .moon::after { width: 125px; height: 125px; }
      .poster::before { width: 400px; height: 400px; top: 200px; }
      .poster::after { width: 470px; height: 470px; top: 165px; }
    }

    @media print {
      @page { size: A4 portrait; margin: 0; }
      body { min-height: auto; padding: 0; background: var(--night); print-color-adjust: exact; -webkit-print-color-adjust: exact; }
      .poster { width: 210mm; min-height: 297mm; border: 0; border-radius: 0; box-shadow: none; }
    }
  </style>
</head>
<body>
  <main class="poster" aria-labelledby="poster-title">
    <span class="corner one" aria-hidden="true">✦</span>
    <span class="corner two" aria-hidden="true">✦</span>

    <p class="club">AS Verzy</p>
    <p class="eyebrow">Une nuit mystérieuse…</p>
    <h1 id="poster-title">Happy <span>Halloween</span></h1>
    <p class="subtitle">La soirée qui donne des frissons</p>

    <div class="moon-scene" aria-hidden="true">
      <div class="moon"></div>
      <span class="bat a">✦</span>
      <span class="bat b">✦</span>
      <span class="bat c">✦</span>
      <div class="pumpkins"><span>🎃</span><span>🎃</span><span>🎃</span></div>
    </div>

    <p class="invitation">Soirée des licenciés</p>
    <p class="for-who">L’AS Verzy vous invite à célébrer Halloween&nbsp;!</p>
    <hr class="rule">
    <p class="details">Date · Heure · Lieu : informations à venir</p>
    <p class="footer">Costumes et bonne humeur vivement conseillés</p>
  </main>
</body>
</html>
